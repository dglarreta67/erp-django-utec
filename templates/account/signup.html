{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:60vh;">
    <div class="erp-card" style="width:100%;max-width:440px;">
        <div class="erp-card-header" style="text-align:center;">
            ✨ Crear cuenta de acceso
        </div>

        <form method="post" action="{% url 'account_signup' %}" style="margin-top:.5rem;">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-4">
                <label class="erp-label">{{ field.label }}</label>
                {{ field }}
                {% for e in field.errors %}
                    <p style="color:var(--clr-danger);font-size:.82rem;">{{ e }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-erp-gold" style="width:100%;padding:.6rem;">Crear cuenta</button>
        </form>

        <p style="text-align:center;margin-top:1rem;" class="text-muted">
            ¿Ya tienes cuenta? <a href="{% url 'account_login' %}">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}

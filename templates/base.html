<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ERP Django{% endblock %} · UTEC Celaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root, [data-theme="light"] {
            --clr-navy: #0A2342; --clr-royal: #1B4F8A; --clr-sky: #4A90D9;
            --clr-ice: #E8F0FB; --clr-gold: #B8860B; --clr-amber: #D4A017;
            --clr-cream: #FDF8E8; --clr-bg: #F5F7FA; --clr-surface: #FFFFFF;
            --clr-text: #1A1A2E; --clr-muted: #5A6A7E; --clr-border: #C8D8EC;
            --clr-danger: #C0392B; --clr-ok: #1A7A4A;
        }
        [data-theme="dark"] {
            --clr-navy: #1E3A5F; --clr-royal: #2E5F9E; --clr-sky: #6BAEE8;
            --clr-ice: #1A2A3A; --clr-gold: #D4AF37; --clr-amber: #E8C547;
            --clr-cream: #2A2510; --clr-bg: #0D1B2A; --clr-surface: #142033;
            --clr-text: #E2EAF4; --clr-muted: #8AA0B8; --clr-border: #2A3F58;
            --clr-danger: #E74C3C; --clr-ok: #2ECC71;
        }
        body { background: var(--clr-bg); color: var(--clr-text); font-family: sans-serif; margin: 0; }
        .erp-navbar { background: var(--clr-navy); border-bottom: 3px solid var(--clr-gold); padding: .65rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .erp-brand { color: var(--clr-gold) !important; font-size: 1.3rem; font-weight: 700; text-decoration: none; }
        .erp-nav-link { color: rgba(255,255,255,.82) !important; padding: .35rem .75rem; text-decoration: none; }
        .erp-nav-link:hover, .erp-nav-link.active { background: var(--clr-royal); border-radius: 6px; }
        .erp-card { background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .erp-card-header { background: var(--clr-navy); color: #FFF; padding: .85rem 1.25rem; border-left: 5px solid var(--clr-gold); margin: -1.5rem -1.5rem 1.5rem; border-radius: 10px 10px 0 0; }
        .erp-table { width: 100%; border-collapse: collapse; }
        .erp-table th { background: var(--clr-navy); color: #FFF; padding: .75rem; border-bottom: 3px solid var(--clr-gold); text-align: left; }
        .erp-table td { padding: .65rem; border-bottom: 1px solid var(--clr-border); }
        .btn-erp-gold { background: var(--clr-gold); color: var(--clr-navy); border: none; padding: .45rem 1.2rem; border-radius: 8px; font-weight: 700; text-decoration: none; cursor: pointer; }
        .btn-erp-primary { background: var(--clr-navy); color: #FFF; border: 1px solid var(--clr-gold); padding: .45rem 1.2rem; border-radius: 8px; text-decoration: none; }
        .btn-erp-danger { background: var(--clr-danger); color: #FFF; border: none; padding: .4rem 1rem; border-radius: 8px; text-decoration: none; }
        .btn-erp-sm { padding: .25rem .7rem; font-size: .8rem; }
        .erp-input { width: 100%; padding: .5rem; border: 1.5px solid var(--clr-border); border-radius: 8px; background: var(--clr-surface); color: var(--clr-text); }
        .badge-erp-active { background: rgba(26,122,74,.12); color: var(--clr-ok); border: 1px solid currentColor; padding: .2rem .6rem; border-radius: 20px; font-size: .75rem; }
        .badge-erp-inactive { background: rgba(192,57,43,.1); color: var(--clr-danger); border: 1px solid currentColor; padding: .2rem .6rem; border-radius: 20px; font-size: .75rem; }
        .erp-alert-success { background: rgba(26,122,74,.1); border-left: 5px solid var(--clr-ok); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .erp-alert-danger { background: rgba(192,57,43,.1); border-left: 5px solid var(--clr-danger); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .erp-alert-info { background: var(--clr-ice); border-left: 5px solid var(--clr-sky); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    </style>
</head>
<body>
<nav class="erp-navbar">
    <a class="erp-brand" href="/">📦 ERP Django</a>
    <div>
        <a href="{% url 'productos:lista' %}" class="erp-nav-link {% block nav_productos %}{% endblock %}">Productos</a>
        <a href="{% url 'clientes:lista' %}" class="erp-nav-link {% block nav_clientes %}{% endblock %}">Clientes</a>
        <a href="{% url 'proveedores:lista' %}" class="erp-nav-link {% block nav_proveedores %}{% endblock %}">Proveedores</a>
        <a href="{% url 'ventas:lista' %}" class="erp-nav-link {% block nav_ventas %}{% endblock %}">Ventas</a>
        {% if user.is_authenticated %}
            <a href="{% url 'account_logout' %}" class="erp-nav-link">Salir ({{ user.username }})</a>
        {% else %}
            <a href="{% url 'account_login' %}" class="erp-nav-link">Entrar</a>
        {% endif %}
    </div>
</nav>

{% if messages %}
<div class="container mt-3">
    {% for m in messages %}
    <div class="erp-alert-{% if m.tags == 'error' %}danger{% else %}success{% endif %}">
        {{ m }}
    </div>
    {% endfor %}
</div>
{% endif %}

<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>

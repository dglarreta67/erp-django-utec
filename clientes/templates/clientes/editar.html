{% extends "base.html" %}
{% block title %}Editar — {{ cliente.nombre }}{% endblock %}
{% block nav_clientes %}active{% endblock %}

{% block content %}
<h2>✏️ Editar: {{ cliente.nombre }}</h2>
<div class="erp-card" style="max-width:580px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-erp-gold">Actualizar</button>
        <a href="{% url 'clientes:detalle' cliente.pk %}" class="btn-erp-primary">Cancelar</a>
    </form>
</div>
{% endblock %}
